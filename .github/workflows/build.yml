name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    # windows-latest 于 2026-06 迁移到 VS 2026；本工程要求 MSVC VS 2022，
    # 因此固定使用 windows-2022 镜像（GitHub 官方给出的保留 VS 2022 的方式）。
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake / MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Docs reference check
        shell: pwsh
        run: ./tools/docs-check.ps1

      # 冒烟测试：可执行文件 + 资源由 CMake 的 post-build 复制。
      # ErMao 是 GUI 子系统（发布版不弹控制台），所以用 Start-Process -Wait 等它退出。
      - name: Smoke (release, 30 frames, no editor)
        shell: pwsh
        run: |
          $exe = "build/bin/ErMao.exe"
          if (-not (Test-Path $exe)) { throw "$exe not found" }
          $p = Start-Process -FilePath $exe -ArgumentList "--frames", "30", "--noeditor" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "release smoke failed: exit $($p.ExitCode)" }

      - name: Smoke (development console, 10 frames)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build/bin/ErMao.exe" -ArgumentList "--dev", "--frames", "10", "--noeditor" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "dev smoke failed: exit $($p.ExitCode)" }

      # 2D 幸存者完整循环：自动开局、刷怪、掉落、技能与 UI 跑满 600 帧
      - name: Smoke (2D survivors, 600 frames)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build/bin/ErMao.exe" -ArgumentList "--demo2d", "--frames", "600", "--noeditor" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "2D survivors smoke failed: exit $($p.ExitCode)" }
